[project]
name = "yonca"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask>=2.0.0",
    "flask-sqlalchemy>=2.5.0",
    "flask-migrate>=3.1.0",
    "flask-login>=0.5.0",
    "flask-cors>=3.0.10",
    "flask-session>=0.4.0",
    "flask-babel>=2.0.0",
    "flask-admin>=1.6.0",
    "flask-wtf>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "gunicorn>=20.1.0",
    "wtforms>=3.0.0",
    "langdetect>=1.0.9",
    "beautifulsoup4>=4.9.1",
    "requests>=2.23.0",
    "python-slugify>=5.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=0.4.0",
    "polib>=1.1.0",
    "google-cloud-storage>=3.9.0",
    "flask-limiter>=3.0.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.4.0",
]
