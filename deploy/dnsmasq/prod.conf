# dnsmasq drop-in — production server
# Resolves all *.yonca-sdc.com to loopback so internal requests
# (e.g. app container calling its own domain) are handled by the
# local Caddy instance instead of going out to the public DNS and back.
#
# Install:
#   sudo cp prod.conf /etc/dnsmasq.d/yonca.conf
#   sudo systemctl restart dnsmasq

address=/.yonca-sdc.com/127.0.0.1
