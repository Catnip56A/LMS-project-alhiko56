# dnsmasq drop-in — developer machine (prod-dev profile)
# Resolves local.yonca-sdc.com to loopback so the local Caddy container
# handles the request with its internal CA certificate.
#
# Install:
#   sudo cp local.conf /etc/dnsmasq.d/yonca-local.conf
#   sudo systemctl restart dnsmasq
#
# Or on macOS with Homebrew dnsmasq:
#   cp local.conf $(brew --prefix)/etc/dnsmasq.d/yonca-local.conf
#   brew services restart dnsmasq

address=/local.yonca-sdc.com/127.0.0.1
