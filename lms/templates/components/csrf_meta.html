<meta name="csrf-token" content="{{ csrf_token() }}">
<script>
    (function() {
        var token = document.querySelector('meta[name="csrf-token"]').content;

        // Auto-inject csrf_token into any <form method="post"> on submit, including
        // forms built dynamically via JS template strings (e.g. innerHTML).
        function injectToken(form) {
            if (form.tagName === 'FORM' && form.method.toLowerCase() === 'post' &&
                !form.querySelector('input[name="csrf_token"]')) {
                var input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'csrf_token';
                input.value = token;
                form.appendChild(input);
            }
        }
        document.addEventListener('submit', function(e) { injectToken(e.target); }, true);

        // form.submit() (unlike a real user submit or form.requestSubmit()) does NOT fire
        // the 'submit' event per spec, so the listener above never runs for it — patch the
        // method itself to catch that case too (e.g. onchange="this.form.submit()").
        var originalFormSubmit = HTMLFormElement.prototype.submit;
        HTMLFormElement.prototype.submit = function() {
            injectToken(this);
            return originalFormSubmit.call(this);
        };

        // Attach the token header to same-origin fetch() calls that change state.
        var originalFetch = window.fetch;
        window.fetch = function(input, init) {
            init = init || {};
            var method = (init.method || 'GET').toUpperCase();
            var url = typeof input === 'string' ? input : (input && input.url) || '';
            var isSameOrigin = url.indexOf('http') !== 0 || url.indexOf(window.location.origin) === 0;
            if (isSameOrigin && ['POST', 'PUT', 'PATCH', 'DELETE'].indexOf(method) !== -1) {
                init.headers = new Headers(init.headers || {});
                if (!init.headers.has('X-CSRFToken')) {
                    init.headers.set('X-CSRFToken', token);
                }
            }
            return originalFetch.call(this, input, init);
        };
    })();
</script>
