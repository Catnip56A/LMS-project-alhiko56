<!-- Adds a show/hide eye-icon toggle to every password field on the page. Self-contained
     (inline SVG icons, no Font Awesome dependency) so it works on standalone pages
     (login.html, signup.html) as well as base.html-extending ones. -->
<style>
.password-toggle-wrapper { position: relative; }
.password-toggle-wrapper input[type="password"],
.password-toggle-wrapper input[type="text"] {
    padding-right: 2.5rem !important;
}
.password-toggle-btn {
    position: absolute;
    right: 0.6rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    width: auto;
    cursor: pointer;
    color: #6b7280;
    display: flex;
    align-items: center;
    line-height: 0;
}
.password-toggle-btn:hover { color: #374151; }
.password-toggle-btn svg { width: 1.15rem; height: 1.15rem; }
</style>
<script>
(function() {
    var EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
    var EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.42 20.42 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 7 11 7a20.32 20.32 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

    function addToggle(input) {
        if (input.dataset.toggleAttached) return;
        input.dataset.toggleAttached = '1';

        var wrapper = document.createElement('div');
        wrapper.className = 'password-toggle-wrapper';
        input.parentNode.insertBefore(wrapper, input);
        wrapper.appendChild(input);

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'password-toggle-btn';
        btn.setAttribute('aria-label', 'Show password');
        btn.innerHTML = EYE_OPEN;
        wrapper.appendChild(btn);

        btn.addEventListener('click', function() {
            var showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            btn.innerHTML = showing ? EYE_OPEN : EYE_OFF;
            btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('input[type="password"]').forEach(addToggle);
    });
})();
</script>
