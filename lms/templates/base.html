<!DOCTYPE html>
<html lang="{{ current_locale or 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include 'components/csrf_meta.html' %}
    <style>html{background:#F9E7CB}</style>
    <title>{% block title %}{{ site_settings.site_name or 'LMS' }}{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%270.9em%27 font-size=%2790%27%3E%F0%9F%8D%80%3C/text%3E%3C/svg%3E">

    <!-- Montserrat font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- Site-wide styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">

    <style>
        body, * { font-family: 'Montserrat', sans-serif !important; }
        code, pre, kbd, samp, .font-monospace { font-family: monospace !important; }
        .fa, .fas, .far, .fal, .fab, [class^="fa-"], [class*=" fa-"] { font-family: 'Font Awesome 5 Free', 'Font Awesome 5 Brands' !important; }

        .youtube-global-modal .modal-dialog {
            max-width: min(96vw, 1400px);
            width: auto;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .youtube-global-modal .modal-content {
            background: #000;
            border: none;
        }

        .youtube-global-modal .modal-header {
            border-bottom: none;
            color: #fff;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .youtube-global-modal .modal-title {
            flex: 1;
            margin-right: 1rem;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .youtube-global-modal .modal-header .btn {
            flex-shrink: 0;
        }

        .youtube-global-modal .close {
            color: #fff;
            opacity: 0.9;
            text-shadow: none;
            font-size: 2rem;
            line-height: 1;
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            flex-shrink: 0;
            margin-left: auto;
        }

        .youtube-global-modal .youtube-global-close-btn {
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        .youtube-global-modal .modal-body {
            padding: 0;
            max-height: calc(100vh - 70px);
            overflow-y: auto;
        }

        .youtube-global-frame-wrap {
            position: relative;
            width: 100vw;
            max-width: 90vw;
            aspect-ratio: 16/9;
            background: #000;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .youtube-global-frame-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            aspect-ratio: 16/9;
            max-width: 100vw;
            max-height: 80vh;
            background: #000;
        }

        /* Responsive adjustments for small screens */
        @media (max-width: 900px) {
            .youtube-global-frame-wrap {
                max-width: 100vw;
            }
        }
        @media (max-width: 600px), (max-height: 600px) {
            .youtube-global-modal .modal-dialog {
                max-width: 100vw;
                margin: 0;
            }
            .youtube-global-frame-wrap {
                max-width: 100vw;
                aspect-ratio: 16/9;
            }
            .youtube-global-frame-wrap iframe {
                max-width: 100vw;
                max-height: 50vh;
            }
        }
        @media (max-width: 400px), (max-height: 400px) {
            .youtube-global-frame-wrap {
                aspect-ratio: 1/1;
            }
            .youtube-global-frame-wrap iframe {
                aspect-ratio: 1/1;
            }
        }

        .youtube-open-large-btn {
            display: inline-block;
            margin: 0 0 0.5rem 0;
        }

        .youtube-overlay-trigger {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.12);
            z-index: 2;
            border: 0;
            padding: 0;
        }

        .youtube-overlay-trigger:hover {
            background: rgba(0, 0, 0, 0.22);
        }

        .youtube-overlay-trigger .youtube-overlay-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            line-height: 1;
        }

    </style>

    {% block head %}
    <style>
        /* Active navigation styling */
        .navbar-nav .nav-link.active {
            color: #007bff !important;
            font-weight: bold;
            border-bottom: 2px solid #007bff;
        }
    </style>
    {% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    <div class="modal fade youtube-global-modal" id="youtubeGlobalModal" tabindex="-1" role="dialog" aria-labelledby="youtubeGlobalModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="youtubeGlobalModalLabel">{{ _('YouTube Video') }}</h5>
                    <button type="button" class="btn btn-sm btn-outline-light youtube-global-close-btn" data-dismiss="modal">{{ _('Close Large View') }}</button>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="youtube-global-frame-wrap">
                        <iframe id="youtubeGlobalModalFrame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}
    <!-- Scroll position preservation -->
    <script>
        // Store scroll position before page unload
        window.addEventListener('beforeunload', function() {
            sessionStorage.setItem('scrollPosition', window.scrollY);
        });

        // Restore scroll position after page load
        window.addEventListener('load', function() {
            const scrollPosition = sessionStorage.getItem('scrollPosition');
            if (scrollPosition) {
                // Small delay to ensure page is fully rendered
                setTimeout(function() {
                    window.scrollTo(0, parseInt(scrollPosition));
                    sessionStorage.removeItem('scrollPosition');
                }, 100);
            }
        });

        // Also handle browser back/forward navigation
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                const scrollPosition = sessionStorage.getItem('scrollPosition');
                if (scrollPosition) {
                    window.scrollTo(0, parseInt(scrollPosition));
                    sessionStorage.removeItem('scrollPosition');
                }
            }
        });

        // Modify login links to include current URL as next parameter
        document.addEventListener('DOMContentLoaded', function() {
            const loginLinks = document.querySelectorAll('a[href="/login"], button[onclick*="window.location.href=\'/login\'"]');
            loginLinks.forEach(function(link) {
                if (link.tagName === 'A') {
                    const currentUrl = encodeURIComponent(window.location.href);
                    link.href = '/login?next=' + currentUrl;
                } else if (link.tagName === 'BUTTON') {
                    const currentUrl = encodeURIComponent(window.location.href);
                    link.onclick = function() {
                        window.location.href = '/login?next=' + currentUrl;
                    };
                }
            });
        });

        // Highlight the nav link matching the current page (real routes now, not SPA hash sections)
        document.addEventListener('DOMContentLoaded', function() {
            const navLinks = document.querySelectorAll('.navbar-nav .nav-link[data-nav]');
            const path = window.location.pathname;
            navLinks.forEach(function(link) {
                let linkPath;
                try {
                    linkPath = new URL(link.href, window.location.origin).pathname;
                } catch (e) {
                    return;
                }
                const isActive = (linkPath === '/') ? (path === '/') : path.startsWith(linkPath);
                link.classList.toggle('active', isActive);
            });
        });
    </script>
    {% endblock %}

    <script>
        function lmsExtractYouTubeEmbed(rawUrl) {
            try {
                const url = new URL(rawUrl, window.location.origin);
                const host = url.hostname.toLowerCase();
                let videoId = '';

                if (host.includes('youtu.be')) {
                    videoId = url.pathname.replace('/', '').trim();
                } else if (host.includes('youtube.com') || host.includes('youtube-nocookie.com')) {
                    if (url.pathname.startsWith('/watch')) {
                        videoId = (url.searchParams.get('v') || '').trim();
                    } else if (url.pathname.startsWith('/embed/')) {
                        videoId = url.pathname.split('/embed/')[1].split('/')[0].trim();
                    } else if (url.pathname.startsWith('/shorts/')) {
                        videoId = url.pathname.split('/shorts/')[1].split('/')[0].trim();
                    }
                }

                if (!videoId) return null;
                return 'https://www.youtube.com/embed/' + encodeURIComponent(videoId) + '?autoplay=1&rel=0';
            } catch (err) {
                return null;
            }
        }

        function lmsOpenYouTubeLarge(embedUrl) {
            if (!embedUrl) return;
            $('#youtubeGlobalModalFrame').attr('src', embedUrl);
            $('#youtubeGlobalModal').modal('show');
        }

        document.addEventListener('DOMContentLoaded', function() {
            $(document).on('click', 'a[href*="youtube.com/watch"], a[href*="youtu.be/"], a[href*="youtube.com/embed/"], a[href*="youtube.com/shorts/"], a[href*="youtube-nocookie.com/embed/"]', function(e) {
                const embedUrl = lmsExtractYouTubeEmbed(this.href);
                if (!embedUrl) return;
                e.preventDefault();
                e.stopPropagation();
                lmsOpenYouTubeLarge(embedUrl);
            });

            document.querySelectorAll('iframe[src*="youtube.com/embed/"], iframe[src*="youtube-nocookie.com/embed/"]').forEach(function(iframe) {
                // Skip the course guide video (uses auto-expand on play)
                if (iframe.id === 'youtubeGuideIframe') return;
                if (iframe.dataset.lmsLargeBound === '1') return;
                iframe.dataset.lmsLargeBound = '1';

                const src = iframe.getAttribute('src') || '';
                const embedUrl = lmsExtractYouTubeEmbed(src);
                if (!embedUrl) return;

                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'btn btn-sm btn-outline-primary youtube-open-large-btn';
                button.textContent = '{{ _("Open in Large View") }}';
                button.addEventListener('click', function() {
                    lmsOpenYouTubeLarge(embedUrl);
                });

                iframe.parentNode.insertBefore(button, iframe);

                const parent = iframe.parentElement;
                if (parent) {
                    if (window.getComputedStyle(parent).position === 'static') {
                        parent.style.position = 'relative';
                    }

                    const overlay = document.createElement('button');
                    overlay.type = 'button';
                    overlay.className = 'youtube-overlay-trigger';
                    overlay.setAttribute('aria-label', '{{ _("Open video in large view") }}');
                    overlay.innerHTML = '<span class="youtube-overlay-icon">▶</span>';
                    overlay.addEventListener('click', function() {
                        lmsOpenYouTubeLarge(embedUrl);
                    });

                    parent.appendChild(overlay);
                }
            });

            $('#youtubeGlobalModal').on('hidden.bs.modal', function() {
                $('#youtubeGlobalModalFrame').attr('src', '');
            });
        });
    </script>
    {% include 'components/cookie_consent.html' %}
</body>
</html>
