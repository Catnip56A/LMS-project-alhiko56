services:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  libretranslate:
    profiles: [dev, production, staging]
    image: libretranslate/libretranslate
    restart: unless-stopped
    command: ["--load-only", "en,az,ru"]
    volumes:
      - ./data/libretranslate:/home/libretranslate/.local/share
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/languages')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ── Development ───────────────────────────────────────────────────────────────
  db-dev:
    image: postgres:17-alpine
    profiles: [dev]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate-dev:
    profiles: [dev]
    build: .
    restart: no
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-dev:5432/${POSTGRES_DB}
    depends_on:
      db-dev:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations   # exposes generated files to host
    command: flask db upgrade

  app-dev:
    profiles: [dev]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-dev:5432/${POSTGRES_DB}
      GOOGLE_REDIRECT_URI: https://${LOCAL_DOMAIN:-local.yonca-sdc.com}/auth/google/callback
      LIBRETRANSLATE_URL: http://libretranslate:5000
      CERT_TEMPLATE_DIR: /app/data/cert-templates
    ports:
      - "8000:8000"
    depends_on:
      migrate-dev:
        condition: service_completed_successfully
      libretranslate:
        condition: service_healthy
    volumes:
      - ./data/flask_session:/app/flask_session
      - ./data/logs:/app/logs
      - ./data/certificates:/app/data/certificates
      - ./data/cert-templates:/app/data/cert-templates

  caddy-dev:
    profiles: [dev]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:-local.yonca-sdc.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.local/certs:/certs:ro
    depends_on:
      - app-dev

  # ── Production ────────────────────────────────────────────────────────────────
  db-production:
    image: postgres:17-alpine
    profiles: [production]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate-production:
    profiles: [production]
    image: ghcr.io/${GHCR_OWNER}/yonca:${IMAGE_TAG:-latest}
    restart: no
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-production:5432/${POSTGRES_DB}
    depends_on:
      db-production:
        condition: service_healthy
    command: flask db upgrade

  app-production:
    profiles: [production]
    image: ghcr.io/${GHCR_OWNER}/yonca:${IMAGE_TAG:-latest}
    hostname: ${APP_HOSTNAME}
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-production:5432/${POSTGRES_DB}
      GOOGLE_REDIRECT_URI: https://${DOMAIN}/auth/google/callback
      LIBRETRANSLATE_URL: http://libretranslate:5000
      CERT_TEMPLATE_DIR: /app/data/cert-templates
    ports:
      - "127.0.0.1:${APP_PORT}:8000"
    depends_on:
      migrate-production:
        condition: service_completed_successfully
      libretranslate:
        condition: service_healthy
    networks:
      - default
      - yonca-proxy
    volumes:
      - ./data/flask_session:/app/flask_session
      - ./data/logs:/app/logs
      - ./data/certificates:/app/data/certificates
      - ./data/cert-templates:/app/data/cert-templates

  # ── Staging ────────────────────────────────────────────────────────────────
  db-staging:
    image: postgres:17-alpine
    profiles: [staging]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate-staging:
    profiles: [staging]
    image: ghcr.io/${GHCR_OWNER}/yonca:${IMAGE_TAG:-latest}
    restart: no
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-staging:5432/${POSTGRES_DB}
    depends_on:
      db-staging:
        condition: service_healthy
    command: flask db upgrade

  app-staging:
    profiles: [staging]
    image: ghcr.io/${GHCR_OWNER}/yonca:${IMAGE_TAG:-latest}
    hostname: ${APP_HOSTNAME}
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-staging:5432/${POSTGRES_DB}
      GOOGLE_REDIRECT_URI: https://${DOMAIN}/auth/google/callback
      LIBRETRANSLATE_URL: http://libretranslate:5000
      CERT_TEMPLATE_DIR: /app/data/cert-templates
    ports:
      - "127.0.0.1:${APP_PORT}:8000"
    depends_on:
      migrate-staging:
        condition: service_completed_successfully
      libretranslate:
        condition: service_healthy
    networks:
      - default
      - yonca-proxy
    volumes:
      - ./data/flask_session:/app/flask_session
      - ./data/logs:/app/logs
      - ./data/certificates:/app/data/certificates
      - ./data/cert-templates:/app/data/cert-templates
networks:
  yonca-proxy:
    external: true
    name: yonca-proxy
