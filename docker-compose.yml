services:

  # ── Development ───────────────────────────────────────────────────────────────
  db-dev:
    image: postgres:17-alpine
    profiles: [dev]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-dev:
    image: redis:7-alpine
    profiles: [dev]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate-dev:
    profiles: [dev]
    build: .
    restart: no
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-dev:5432/${POSTGRES_DB}
    depends_on:
      db-dev:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations   # exposes generated files to host
    command: flask db upgrade

  app-dev:
    profiles: [dev]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-dev:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis-dev:6379/0
      GOOGLE_REDIRECT_URI: https://${LOCAL_DOMAIN:-local.yourdomain.example.com}/auth/google/callback
      CERT_TEMPLATE_DIR: /app/data/cert-templates
    depends_on:
      migrate-dev:
        condition: service_completed_successfully
      redis-dev:
        condition: service_healthy
    volumes:
      - ./data/flask_session:/app/flask_session
      - ./data/logs:/app/logs
      - ./data/certificates:/app/data/certificates
      - ./data/cert-templates:/app/data/cert-templates

  worker-dev:
    profiles: [dev]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-dev:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis-dev:6379/0
    depends_on:
      migrate-dev:
        condition: service_completed_successfully
      redis-dev:
        condition: service_healthy
    command: python -m lms.worker

  caddy-dev:
    profiles: [dev]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:-local.yourdomain.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.local/certs:/certs:ro
    depends_on:
      - app-dev

  # ── Production ────────────────────────────────────────────────────────────────
  db-production:
    image: postgres:17-alpine
    profiles: [production]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-production:
    image: redis:7-alpine
    profiles: [production]
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate-production:
    profiles: [production]
    image: ghcr.io/${GHCR_OWNER}/lms:${IMAGE_TAG:-latest}
    restart: no
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-production:5432/${POSTGRES_DB}
    depends_on:
      db-production:
        condition: service_healthy
    command: flask db upgrade

  app-production:
    profiles: [production]
    image: ghcr.io/${GHCR_OWNER}/lms:${IMAGE_TAG:-latest}
    hostname: ${APP_HOSTNAME}
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-production:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis-production:6379/0
      GOOGLE_REDIRECT_URI: https://${DOMAIN}/auth/google/callback
      CERT_TEMPLATE_DIR: /app/data/cert-templates
    ports:
      - "127.0.0.1:${APP_PORT}:8000"
    depends_on:
      migrate-production:
        condition: service_completed_successfully
      redis-production:
        condition: service_healthy
    networks:
      - default
      - lms-proxy
    volumes:
      - ./data/flask_session:/app/flask_session
      - ./data/logs:/app/logs
      - ./data/certificates:/app/data/certificates
      - ./data/cert-templates:/app/data/cert-templates

  worker-production:
    profiles: [production]
    image: ghcr.io/${GHCR_OWNER}/lms:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-production:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis-production:6379/0
    depends_on:
      migrate-production:
        condition: service_completed_successfully
      redis-production:
        condition: service_healthy
    command: python -m lms.worker

  # ── Staging ────────────────────────────────────────────────────────────────
  db-staging:
    image: postgres:17-alpine
    profiles: [staging]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-staging:
    image: redis:7-alpine
    profiles: [staging]
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate-staging:
    profiles: [staging]
    image: ghcr.io/${GHCR_OWNER}/lms:${IMAGE_TAG:-latest}
    restart: no
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-staging:5432/${POSTGRES_DB}
    depends_on:
      db-staging:
        condition: service_healthy
    command: flask db upgrade

  app-staging:
    profiles: [staging]
    image: ghcr.io/${GHCR_OWNER}/lms:${IMAGE_TAG:-latest}
    hostname: ${APP_HOSTNAME}
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-staging:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis-staging:6379/0
      GOOGLE_REDIRECT_URI: https://${DOMAIN}/auth/google/callback
      CERT_TEMPLATE_DIR: /app/data/cert-templates
    ports:
      - "127.0.0.1:${APP_PORT}:8000"
    depends_on:
      migrate-staging:
        condition: service_completed_successfully
      redis-staging:
        condition: service_healthy
    networks:
      - default
      - lms-proxy
    volumes:
      - ./data/flask_session:/app/flask_session
      - ./data/logs:/app/logs
      - ./data/certificates:/app/data/certificates
      - ./data/cert-templates:/app/data/cert-templates

  worker-staging:
    profiles: [staging]
    image: ghcr.io/${GHCR_OWNER}/lms:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-staging:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis-staging:6379/0
    depends_on:
      migrate-staging:
        condition: service_completed_successfully
      redis-staging:
        condition: service_healthy
    command: python -m lms.worker
networks:
  lms-proxy:
    external: true
    name: lms-proxy
