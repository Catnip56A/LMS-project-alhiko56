<!DOCTYPE html>
<html lang="{{ current_locale or 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ home_content.site_name or 'Yonca' }}{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%270.9em%27 font-size=%2790%27%3E%F0%9F%8D%80%3C/text%3E%3C/svg%3E">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- Site-wide styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">

    <style>
        .youtube-global-modal .modal-dialog {
            max-width: min(96vw, 1400px);
            width: auto;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .youtube-global-modal .modal-content {
            background: #000;
            border: none;
        }

        .youtube-global-modal .modal-header {
            border-bottom: none;
            color: #fff;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .youtube-global-modal .modal-title {
            flex: 1;
            margin-right: 1rem;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .youtube-global-modal .modal-header .btn {
            flex-shrink: 0;
        }

        .youtube-global-modal .close {
            color: #fff;
            opacity: 0.9;
            text-shadow: none;
            font-size: 2rem;
            line-height: 1;
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            flex-shrink: 0;
            margin-left: auto;
        }

        .youtube-global-modal .youtube-global-close-btn {
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        .youtube-global-modal .modal-body {
            padding: 0;
            max-height: calc(100vh - 70px);
            overflow-y: auto;
        }

        .youtube-global-frame-wrap {
            position: relative;
            width: 100vw;
            max-width: 90vw;
            aspect-ratio: 16/9;
            background: #000;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .youtube-global-frame-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            aspect-ratio: 16/9;
            max-width: 100vw;
            max-height: 80vh;
            background: #000;
        }

        /* Responsive adjustments for small screens */
        @media (max-width: 900px) {
            .youtube-global-frame-wrap {
                max-width: 100vw;
            }
        }
        @media (max-width: 600px), (max-height: 600px) {
            .youtube-global-modal .modal-dialog {
                max-width: 100vw;
                margin: 0;
            }
            .youtube-global-frame-wrap {
                max-width: 100vw;
                aspect-ratio: 16/9;
            }
            .youtube-global-frame-wrap iframe {
                max-width: 100vw;
                max-height: 50vh;
            }
        }
        @media (max-width: 400px), (max-height: 400px) {
            .youtube-global-frame-wrap {
                aspect-ratio: 1/1;
            }
            .youtube-global-frame-wrap iframe {
                aspect-ratio: 1/1;
            }
        }

        .youtube-open-large-btn {
            display: inline-block;
            margin: 0 0 0.5rem 0;
        }

        .youtube-overlay-trigger {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.12);
            z-index: 2;
            border: 0;
            padding: 0;
        }

        .youtube-overlay-trigger:hover {
            background: rgba(0, 0, 0, 0.22);
        }

        .youtube-overlay-trigger .youtube-overlay-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            line-height: 1;
        }

    </style>

    {% block head %}
    <style>
        /* Active navigation styling */
        .navbar-nav .nav-link.active {
            color: #007bff !important;
            font-weight: bold;
            border-bottom: 2px solid #007bff;
        }
    </style>
    {% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    <div class="modal fade youtube-global-modal" id="youtubeGlobalModal" tabindex="-1" role="dialog" aria-labelledby="youtubeGlobalModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="youtubeGlobalModalLabel">{{ _('YouTube Video') }}</h5>
                    <button type="button" class="btn btn-sm btn-outline-light youtube-global-close-btn" data-dismiss="modal">{{ _('Close Large View') }}</button>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="youtube-global-frame-wrap">
                        <iframe id="youtubeGlobalModalFrame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}
    <!-- Scroll position preservation -->
    <script>
        // Store scroll position before page unload
        window.addEventListener('beforeunload', function() {
            sessionStorage.setItem('scrollPosition', window.scrollY);
        });

        // Restore scroll position after page load
        window.addEventListener('load', function() {
            const scrollPosition = sessionStorage.getItem('scrollPosition');
            if (scrollPosition) {
                // Small delay to ensure page is fully rendered
                setTimeout(function() {
                    window.scrollTo(0, parseInt(scrollPosition));
                    sessionStorage.removeItem('scrollPosition');
                }, 100);
            }
        });

        // Also handle browser back/forward navigation
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                const scrollPosition = sessionStorage.getItem('scrollPosition');
                if (scrollPosition) {
                    window.scrollTo(0, parseInt(scrollPosition));
                    sessionStorage.removeItem('scrollPosition');
                }
            }
        });

        // Modify login links to include current URL as next parameter
        document.addEventListener('DOMContentLoaded', function() {
            const loginLinks = document.querySelectorAll('a[href="/login"], button[onclick*="window.location.href=\'/login\'"]');
            loginLinks.forEach(function(link) {
                if (link.tagName === 'A') {
                    const currentUrl = encodeURIComponent(window.location.href);
                    link.href = '/login?next=' + currentUrl;
                } else if (link.tagName === 'BUTTON') {
                    const currentUrl = encodeURIComponent(window.location.href);
                    link.onclick = function() {
                        window.location.href = '/login?next=' + currentUrl;
                    };
                }
            });
        });

        // Navigation state preservation
        document.addEventListener('DOMContentLoaded', function() {
            const navLinks = document.querySelectorAll('.navbar-nav .nav-link[data-nav]');
            
            // Function to set active navigation item
            function setActiveNav(navKey) {
                // Remove active class from all nav items
                navLinks.forEach(link => {
                    link.classList.remove('active');
                });
                
                // Add active class to the specified nav item
                const activeLink = document.querySelector(`.navbar-nav .nav-link[data-nav="${navKey}"]`);
                if (activeLink) {
                    activeLink.classList.add('active');
                }
            }
            
            // Store navigation state when clicking nav links
            navLinks.forEach(link => {
                link.addEventListener('click', function() {
                    const navKey = this.getAttribute('data-nav');
                    sessionStorage.setItem('activeNav', navKey);
                });
            });
            
            // Restore navigation state on page load
            const savedActiveNav = sessionStorage.getItem('activeNav');
            if (savedActiveNav) {
                setActiveNav(savedActiveNav);
            } else {
                // Default to home if no saved state
                setActiveNav('home');
            }
            
            // Also handle URL-based navigation (hash changes)
            function updateNavFromHash() {
                const hash = window.location.hash.substring(1); // Remove the #
                const pathname = window.location.pathname;
                let navKey = 'home'; // Default
                
                // Check if on course description page
                if (pathname.startsWith('/courseDescription/')) {
                    navKey = 'courses';
                } else {
                    // Map hash to nav key
                    switch(hash) {
                        case 'courses':
                            navKey = 'courses';
                            break;
                        case 'forum':
                            navKey = 'forum';
                            break;
                        case 'resources':
                            navKey = 'resources';
                            break;
                        case 'tavi-test':
                            navKey = 'tavi-test';
                            break;
                        case 'contact':
                            navKey = 'contact';
                            break;
                        case 'about':
                            navKey = 'about';
                            break;
                        default:
                            navKey = 'home';
                    }
                }
                
                setActiveNav(navKey);
                sessionStorage.setItem('activeNav', navKey);
            }
            
            // Listen for hash changes
            window.addEventListener('hashchange', updateNavFromHash);
            
            // Set initial state based on current URL
            updateNavFromHash();
        });
    </script>
    {% endblock %}

    <script>
        function yoncaExtractYouTubeEmbed(rawUrl) {
            try {
                const url = new URL(rawUrl, window.location.origin);
                const host = url.hostname.toLowerCase();
                let videoId = '';

                if (host.includes('youtu.be')) {
                    videoId = url.pathname.replace('/', '').trim();
                } else if (host.includes('youtube.com') || host.includes('youtube-nocookie.com')) {
                    if (url.pathname.startsWith('/watch')) {
                        videoId = (url.searchParams.get('v') || '').trim();
                    } else if (url.pathname.startsWith('/embed/')) {
                        videoId = url.pathname.split('/embed/')[1].split('/')[0].trim();
                    } else if (url.pathname.startsWith('/shorts/')) {
                        videoId = url.pathname.split('/shorts/')[1].split('/')[0].trim();
                    }
                }

                if (!videoId) return null;
                return 'https://www.youtube.com/embed/' + encodeURIComponent(videoId) + '?autoplay=1&rel=0';
            } catch (err) {
                return null;
            }
        }

        function yoncaOpenYouTubeLarge(embedUrl) {
            if (!embedUrl) return;
            $('#youtubeGlobalModalFrame').attr('src', embedUrl);
            $('#youtubeGlobalModal').modal('show');
        }

        document.addEventListener('DOMContentLoaded', function() {
            $(document).on('click', 'a[href*="youtube.com/watch"], a[href*="youtu.be/"], a[href*="youtube.com/embed/"], a[href*="youtube.com/shorts/"], a[href*="youtube-nocookie.com/embed/"]', function(e) {
                const embedUrl = yoncaExtractYouTubeEmbed(this.href);
                if (!embedUrl) return;
                e.preventDefault();
                e.stopPropagation();
                yoncaOpenYouTubeLarge(embedUrl);
            });

            document.querySelectorAll('iframe[src*="youtube.com/embed/"], iframe[src*="youtube-nocookie.com/embed/"]').forEach(function(iframe) {
                if (iframe.dataset.yoncaLargeBound === '1') return;
                iframe.dataset.yoncaLargeBound = '1';

                const src = iframe.getAttribute('src') || '';
                const embedUrl = yoncaExtractYouTubeEmbed(src);
                if (!embedUrl) return;

                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'btn btn-sm btn-outline-primary youtube-open-large-btn';
                button.textContent = '{{ _("Open in Large View") }}';
                button.addEventListener('click', function() {
                    yoncaOpenYouTubeLarge(embedUrl);
                });

                iframe.parentNode.insertBefore(button, iframe);

                const parent = iframe.parentElement;
                if (parent) {
                    if (window.getComputedStyle(parent).position === 'static') {
                        parent.style.position = 'relative';
                    }

                    const overlay = document.createElement('button');
                    overlay.type = 'button';
                    overlay.className = 'youtube-overlay-trigger';
                    overlay.setAttribute('aria-label', '{{ _("Open video in large view") }}');
                    overlay.innerHTML = '<span class="youtube-overlay-icon">▶</span>';
                    overlay.addEventListener('click', function() {
                        yoncaOpenYouTubeLarge(embedUrl);
                    });

                    parent.appendChild(overlay);
                }
            });

            $('#youtubeGlobalModal').on('hidden.bs.modal', function() {
                $('#youtubeGlobalModalFrame').attr('src', '');
            });
        });
    </script>
</body>
</html>
