name: Deploy

on:
  push:
    branches: [main, staging]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/yonca

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref_name == 'main' && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy app files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,deploy/backup.sh,deploy/restore.sh"
          target: /home/${{ secrets.SSH_USER }}/deploy/${{ github.ref_name }}/yonca

      - name: Copy shared Caddy config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/caddy/Caddyfile,deploy/caddy/docker-compose.yml"
          target: /home/${{ secrets.SSH_USER }}/deploy/caddy
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/deploy/${{ github.ref_name }}/yonca

            cat > .env <<'EOF'
            FLASK_ENV=production
            IMAGE_TAG=${{ github.sha }}
            WEB_CONCURRENCY=${{ vars.WEB_CONCURRENCY || '3' }}
            GHCR_OWNER=${{ github.repository_owner }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            DOMAIN=${{ github.ref_name == 'main' && secrets.DOMAIN || secrets.STAGING_DOMAIN }}
            POSTGRES_PORT=${{ github.ref_name == 'main' && '5439' || '5438' }}
            APP_PORT=${{ github.ref_name == 'main' && '5002' || '5001' }}
            EOF
            echo "APP_HOSTNAME=$(grep '^DOMAIN=' .env | cut -d= -f2 | tr '.' '-')" >> .env

            mkdir -p data/libretranslate && chmod a+w data/libretranslate
            chmod +x deploy/backup.sh deploy/restore.sh
            keyfile=$(mktemp)
            echo '${{ secrets.GCS_JSON }}' > $keyfile
            /home/${{ secrets.SSH_USER }}/google-cloud-sdk/bin/gcloud auth activate-service-account --key-file=$keyfile
            export GCS_BUCKET="gs://yonca-main-site-db-backup"
            ./deploy/backup.sh /home/${{ secrets.SSH_USER }}/backup/yonca/${{ github.ref_name == 'main' && 'production' || 'staging' }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose --profile prod pull
            docker compose --profile prod up -d --remove-orphans
            cd ~/deploy/caddy && docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -f
