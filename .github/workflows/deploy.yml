name: Deploy

on:
  push:
    branches: [main, staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LC }}/lms:${{ github.ref_name }}
            ghcr.io/${{ env.REPO_OWNER_LC }}/lms:${{ github.sha }}
            ${{ github.ref_name == 'main' && format('ghcr.io/{0}/lms:latest', env.REPO_OWNER_LC) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

